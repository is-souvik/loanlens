# One-click deploy on Render: a web service plus a Postgres database.
services:
  - type: web
    name: loanlens
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MCP_KEY
        value: ll_volopay_demo_2026
      - key: DATABASE_URL
        fromDatabase:
          name: loanlens-db
          property: connectionString
databases:
  - name: loanlens-db
    plan: free
